<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Test 2-Layouts</title>
</head>

    <style>

        .container1{
            display:flex;
        }
        .container2{
            display:flex;
        }
        .title{
            background-color:white;
            font-size:large;
            color:black;
            text-align: left;
            text-decoration: solid;
            padding:5px;
        }
        .main{
            background-color:rgb(214, 238, 214);
            color:black;
            text-align: center;
            text-decoration: solid;
            padding:150px;
        }
        .header1{
            background-color:green;            
            color:white;
            text-align: center;
            text-decoration: solid;
            padding:30px;
        }
        .footer1{
            background-color:green;
            color:white;
            text-align: center;
            text-decoration: solid;
            padding:30px;
        }
        .left{
            display:flex;
            background-color:rgb(237, 211, 171);
            color:black;
            text-align: top;
            text-decoration: solid;
            padding:100px;
            width: 30%;

        }
        .right{
            display:flex;
            background-color:rgb(125, 212, 223);
            color:black;
            text-align: top;
            text-decoration: solid;
            padding:100px;
            width: 30%;
        }
        .content{
            display:flex;
            background-color:rgb(227, 171, 237);
            color:black;
            text-align: top;
            text-decoration: solid;
            padding:100px;
            width: 30%;
        }
        .header2{
            background-color:rgba(97, 77, 200, 0.818);            
            color:white;
            text-align: center;
            text-decoration: solid;
            padding:30px;
        }
        .footer2{
            background-color:rgba(97, 77, 200, 0.818);
            color:white;
            text-align: center;
            text-decoration: solid;
            padding:30px;
        }
        .sidebar{
            background-color:rgb(166, 166, 167);
            color:black;
            text-align: top;
            text-decoration: solid;
            padding:100px;
            width: 30%;
        }
        .contentarea{
            display:flex;
            background-color:rgb(234, 233, 176);
            color:black;
            text-align: top;
            text-decoration: solid;
            padding:100px;
            width: 70%;
        }
        .header3{
            background-color:rgba(18, 151, 223, 0.818);            
            color:white;
            text-align: center;
            text-decoration: solid;
            padding:30px;
        }
        .footer3{
            background-color:rgba(18, 151, 223, 0.818);
            color:white;
            text-align: center;
            text-decoration: solid;
            padding:30px;
        }
        .nav{
            display:flex;
            background-color:rgba(49, 167, 178, 0.582);            
            color:white;
            text-align: center;
            align-content:space-between;
            text-decoration: solid;
            padding:20px;
            width:30%;
        }
        .container3{
            display:grid;
            grid-template-columns:repeat(4,100px);
            border-radius:20%;
            gap:10px;
            border:auto;
        }
        .cell{
            text-align:center;
            background-color:rgb(133, 182, 225);
            display:flex;
            justify-content:center;
            cursor:pointer;
            font-size:40px;
        }
        @media (max-width:600px){
            .container1{
            flex-direction:column;
             }
            .container2{
            flex-direction:column;
            }                
            .nav{
            flex-direction:column;
            }
            .container3{
                grid-template-columns:repeat(2,100px);
                justify-content:center;
                
            }

        }

    </style>
    <body>
        <header><h1><center>CSS-LAYOUT</center></h2></header>
        <div class="title"><h3>Single Column Layout</h3></div>
        <div class="header1"><h3>Header</h3></div>
        <div class="main"><h3>Main Content</h3></div>
        <div class="footer1"><h3>Footer</h3></div>
        <div class="title"><h3>Three Column Layout</h3></div>
        <div class="header2">Header</div>
        <div class="container2">
            <div class="left"><h3>Left</h3></div>
            <div class="content"><h3>Content</h3></div>
            <div class="right"><h3>Right</h3></div>
        </div>
        <div class="footer2"><h3>Footer</h3></div>
        <br><br>
        <div class="header3"><h3>Header</h3></div>
        <div class="container1">
            <div class="sidebar"><h3>Sidebar</h3></div>
            <div class="contentarea"><h3>Content Area</h3></div>
        </div>
        <div class="footer3"><h3>Footer</h3></div>
        <div class="title"><h3>Navigation Layout</h3></div>
        <div class="container2">
            <div class="nav"><h4>Home</h4></div>
            <div class="nav"><h4>About</h4></div>
            <div class="nav"><h4>Services</h4></div>
            <div class="nav"><h4>Gallery</h4></div>
            <div class="nav"><h4>Contact</h4></div>
        </div>
        <div class="footer3"></div>

        <div class="title"><h2>Grid Layout</h2></div>
        <div class="container3">
            <div class="cell">A</div>
            <div class="cell">B</div>
            <div class="cell">C</div>
            <div class="cell">D</div>
            <div class="cell">E</div>
            <div class="cell">F</div>
            <div class="cell">G</div>
            <div class="cell">H</div>
            <div class="cell">I</div>
            <div class="cell">J</div>
            <div class="cell">K</div>
            <div class="cell">L</div>
            </div>

    </body>

</html>
